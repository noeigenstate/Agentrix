name: Build Windows, macOS and Linux executables

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_dry_run:
        description: Verify a release from tested artifacts without publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse:
    name: Select tested build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run-id: ${{ steps.select.outputs.run-id }}
      artifact-ids: ${{ steps.select.outputs.artifact-ids }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Find a completed build of this exact commit
        id: select
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.release_dry_run)
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_JOBS: >-
            ["Select tested build", "Linux SSH integration", "Windows x64 build",
            "Windows desktop interaction", "Windows desktop terminals", "Windows desktop reading",
            "macOS Apple silicon build and desktop test", "Linux x64 build and desktop tests", "Linux arm64 build and desktop tests"]
        shell: bash
        run: node scripts/ci-select-build.mjs

  remote-linux:
    needs: reuse
    if: needs.reuse.outputs['run-id'] == ''
    name: Linux SSH integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - name: Install test dependencies without desktop native builds
        # A dropped connection (npm's ECONNRESET) once failed a release build before any test ran: one more try.
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund || { sleep 10; npm ci --ignore-scripts --no-audit --no-fund; }
      - name: Remove bundled Claude platform binaries
        run: node scripts/claude-sdk-pack.cjs --clean
      - name: Test remote files and recovery state
        run: python3 -m unittest discover -s tests -p 'remote_worker_test.py' -v
      - name: Test real SSH and Linux PTY integration
        run: |
          node scripts/build-ssh-askpass.cjs
          node --test tests/ssh-config.test.cjs tests/ssh-connection.test.cjs tests/session-restore.test.cjs
  windows:
    name: Windows x64 build
    needs: reuse
    if: needs.reuse.outputs['run-id'] == ''
    runs-on: windows-latest
    timeout-minutes: 35
    outputs:
      version: ${{ steps.version.outputs.version }}
      installer: ${{ steps.version.outputs.installer }}
    defaults:
      run:
        shell: pwsh
    env:
      CI: 'true'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Two-core runners start six PowerShell sessions at once; a first command can take over 20 s.
      AGENTRIX_TEST_TIMEOUT_SCALE: '3'

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Validate release version
        id: version
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw 'Invalid package version.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'The version tag must match package.json.'
          }
          "version=$version" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          "installer=Agentrix-Setup-$version-x64.exe" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Install locked dependencies
        # A dropped connection (npm's ECONNRESET) once failed a release build before any test ran: one more try.
        shell: bash
        run: npm ci --no-audit --no-fund || { sleep 10; npm ci --no-audit --no-fund; }
      - name: Remove bundled Claude platform binaries
        run: node scripts/claude-sdk-pack.cjs --clean

      - name: Install Codex CLI for offline startup checks
        run: npm install --global @openai/codex@0.163.0 --no-audit --no-fund

      - name: Run unit and integration tests
        run: npm test

      - name: Build Windows installer
        run: npm run dist

      - name: Verify installer and automatic update metadata
        run: node scripts/verify-update-artifacts.cjs

      - name: Verify voice packaging
        run: |
          $packed = (npx --no-install @electron/asar list release/win-unpacked/resources/app.asar --is-pack) -replace '\\', '/'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path -LiteralPath release/win-unpacked/resources/app.asar.unpacked/node_modules/sherpa-onnx-win-x64) { throw 'Speech engine is in the Windows app.' }
          if ($packed -match '/node_modules/sherpa-onnx-(win|darwin|linux)-') { throw 'Speech engines are in the Windows app.' }
          if ($packed -notcontains 'pack   : /node_modules/sherpa-onnx-node/sherpa-onnx.js') { throw 'Speech wrapper is missing from app.asar.' }

      - name: Create checksum and build notes
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $installer = "Agentrix-Setup-$version-x64.exe"
          $files = @($installer, "$installer.blockmap", 'latest.yml')
          $checksums = foreach ($name in $files) {
            $file = Join-Path release $name
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing release file: $name" }
            $digest = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $name"
          }
          $checksums | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding utf8
          @(
            'Agentrix — Windows x64 installer'
            "Commit: $env:GITHUB_SHA"
            "Installer with automatic updates: $installer"
            'Install the Setup executable to enable background update checks and downloads.'
            'Codex CLI must be installed separately on the target computer.'
          ) | Set-Content -LiteralPath release/BUILD-INFO.txt -Encoding utf8
          @(
            '## Windows build is ready'
            "- Installer: **$installer**"
            "- Commit: $env:GITHUB_SHA"
            '- Unit tests and packaging checks passed; desktop shards test this same build.'
            '- Download **Agentrix-windows-x64** from the Artifacts section of this run.'
            '- SHA-256 checksums and the automatic update feed are included.'
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Upload verified executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Agentrix-windows-x64
          path: |
            release/Agentrix-Setup-*.exe
            release/Agentrix-Setup-*.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
            release/BUILD-INFO.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      - name: Upload the desktop test build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Agentrix-windows-unpacked
          path: release/win-unpacked/
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  windows-desktop:
    name: Windows desktop ${{ matrix.shard }}
    needs: [reuse, windows]
    if: needs.reuse.outputs['run-id'] == ''
    strategy:
      fail-fast: false
      matrix:
        # Run 41292787796: unchanged desktop commands total 146 / 155 / 149 seconds; setup is extra.
        include:
          - shard: interaction
            screenshots: desktop-test-screenshots
          - shard: terminals
            screenshots: desktop-test-screenshots-terminals
          - shard: reading
            screenshots: desktop-test-screenshots-reading
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      CI: 'true'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      AGENTRIX_TEST_TIMEOUT_SCALE: '3'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        shell: bash
        run: npm ci --no-audit --no-fund || { sleep 10; npm ci --no-audit --no-fund; }
      - name: Remove bundled Claude platform binaries
        run: node scripts/claude-sdk-pack.cjs --clean

      - name: Install Codex CLI for offline startup checks
        run: npm install --global @openai/codex@0.163.0 --no-audit --no-fund

      - name: Build Windows test helpers
        run: node scripts/build-ssh-askpass.cjs

      - name: Download the desktop test build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Agentrix-windows-unpacked
          path: release/win-unpacked

      - name: Download the installer for the actual payload check
        if: matrix.shard == 'interaction'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Agentrix-windows-x64
          path: release

      - name: Verify desktop with actual terminal button clicks
        if: matrix.shard == 'terminals'
        run: node scripts/retry.mjs npm run test:desktop -- --packaged

      - name: Verify local terminal restarts refresh Windows PATH without restarting the app
        if: matrix.shard == 'terminals'
        run: node scripts/retry.mjs npm run test:path-refresh -- --packaged

      - name: Verify session recovery, clipboard and SSH desktop interaction
        if: matrix.shard == 'interaction'
        run: node scripts/retry.mjs npm run test:sessions -- --packaged

      - name: Verify session recovery with delayed window cursor-position answers
        if: matrix.shard == 'terminals'
        run: node scripts/retry.mjs npm run test:restore-slow -- --packaged

      - name: Verify animated project expansion and return
        if: matrix.shard == 'interaction'
        run: |
          node scripts/verify-installer-payload.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installed = Get-Content -LiteralPath .test-output/installer-payload.json -Raw -Encoding UTF8 | ConvertFrom-Json
          node scripts/retry.mjs node scripts/focus-motion-smoke.mjs --executable $installed.executable

      - name: Verify completion notifications only rearm after new input
        if: matrix.shard == 'terminals'
        run: node scripts/retry.mjs npm run test:completion -- --packaged

      - name: Test GPU terminal renderer
        if: matrix.shard == 'terminals'
        run: node scripts/retry.mjs npm run test:gpu-terminal -- --packaged

      - name: Verify file operations and microphone UI with isolated test devices
        if: matrix.shard == 'interaction'
        run: node scripts/retry.mjs npm run test:workspace -- --packaged --slow-copy

      - name: Verify editing, path copying and independent split terminals
        if: matrix.shard == 'interaction'
        run: node scripts/retry.mjs npm run test:editor-terminals -- --packaged

      - name: Verify persistent themes, automatic editing and Markdown previews
        if: matrix.shard == 'interaction'
        run: node scripts/retry.mjs npm run test:themes-markdown -- --packaged

      - name: Verify synchronized lights, readable themes and quiet completed cards
        if: matrix.shard == 'reading'
        run: node scripts/retry.mjs npm run test:visual -- --packaged

      - name: Verify internal navigation and removed external editor and manual completion actions
        if: matrix.shard == 'reading'
        run: node scripts/retry.mjs npm run test:navigation -- --packaged

      - name: Verify Git status, history and explorer switching for local and SSH projects
        if: matrix.shard == 'interaction'
        run: node scripts/retry.mjs npm run test:git -- --packaged

      - name: Verify Command Prompt terminals report prompts, run agents and resume sessions
        if: matrix.shard == 'terminals'
        run: node scripts/retry.mjs npm run test:cmd -- --packaged

      - name: Verify image paths use text-only clipboard data and latest-copy ordering
        if: matrix.shard == 'terminals'
        run: node scripts/retry.mjs npm run test:clipboard -- --packaged

      - name: Verify liquid glass under terminal load and reduced transparency
        if: matrix.shard == 'reading'
        run: node scripts/retry.mjs npm run test:material -- --packaged

      - name: Verify transparent real Codex input and bright text without model requests
        if: matrix.shard == 'reading'
        run: node scripts/retry.mjs npm run test:composer -- --packaged

      - name: Verify reading commands, CLI keys and permission handoff
        if: matrix.shard == 'reading'
        run: node scripts/retry.mjs npm run test:reading -- --packaged

      - name: Verify the model dashboard window, its filters, adoption and layouts
        if: matrix.shard == 'interaction'
        run: node scripts/retry.mjs npm run test:dashboard -- --packaged

      - name: Verify the real native question card at the minimum window, its validation and jump link
        if: matrix.shard == 'reading'
        run: node scripts/retry.mjs npm run test:native-question -- --packaged

      - name: Verify native session events, requests, settings and usage
        if: matrix.shard == 'reading'
        run: node scripts/retry.mjs npm run test:native-session -- --packaged

      - name: Verify packaged SDK and app-server through fake native executables
        if: matrix.shard == 'reading'
        run: node scripts/retry.mjs npm run test:native-session -- --packaged --runtime

      - name: Verify agent hierarchy, queued messages, paged popups and slow autosave
        if: matrix.shard == 'reading'
        run: node scripts/retry.mjs node scripts/reading-hierarchy-smoke.mjs --packaged

      - name: Upload desktop test screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.screenshots }}
          path: |
            .test-output/desktop-*/*.png
            .test-output/cmd-*/*.png
            .test-output/cmd-*/*.json
            .test-output/sessions-*/*.png
            .test-output/workspace-*/*.png
            .test-output/reading-hierarchy-*/*.png
            .test-output/focus-motion-*/*.png
            .test-output/editor-terminals-*/*.png
            .test-output/themes-markdown-*/*.png
            .test-output/themes-markdown-*/wallpapers.json
            .test-output/visual-*/*.png
            .test-output/visual-*/results.json
            .test-output/navigation-*/*.png
            .test-output/clipboard-*/*.png
            .test-output/material-*/*.png
            .test-output/material-*/results.json
            .test-output/composer-*/*.png
            .test-output/composer-*/results.json
            .test-output/reading-*/*.png
            .test-output/reading-*/results.json
            .test-output/path-refresh-*/*.png
            .test-output/path-refresh-*/results.json
            .test-output/git-*/*.png
            .test-output/git-*/results.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  macos:
    needs: reuse
    if: needs.reuse.outputs['run-id'] == ''
    name: macOS Apple silicon build and desktop test
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      archive: ${{ steps.version.outputs.archive }}
      image: ${{ steps.version.outputs.image }}
    env:
      CI: 'true'
      # Signed ad hoc (package.json build.mac.identity "-"); no Developer ID is looked up.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Validate release version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo 'Invalid package version.'; exit 1; }
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "v$version" ]]; then echo 'The version tag must match package.json.'; exit 1; fi
          echo "archive=Agentrix-$version-mac-arm64.zip" >> "$GITHUB_OUTPUT"
          echo "image=Agentrix-$version-mac-arm64.dmg" >> "$GITHUB_OUTPUT"

      - name: Install locked dependencies
        # A dropped connection (npm's ECONNRESET) once failed a release build before any test ran: one more try.
        shell: bash
        run: npm ci --no-audit --no-fund || { sleep 10; npm ci --no-audit --no-fund; }
      - name: Remove bundled Claude platform binaries
        run: node scripts/claude-sdk-pack.cjs --clean

      - name: Run unit and integration tests, including Bash and a real zsh terminal
        shell: bash
        run: |
          brew install bash
          export AGENTRIX_TEST_BASH="$(brew --prefix bash)/bin/bash"
          "$AGENTRIX_TEST_BASH" --version
          npm test
          AGENTRIX_TEST_BASH=/bin/bash node --test --test-name-pattern='^bash wrapper' tests/codex-scope-wrappers.test.cjs

      - name: Build the macOS app, DMG and zip
        run: npm run dist:mac

      - name: Verify the app bundle
        shell: bash
        run: |
          set -euo pipefail
          app="release/mac-arm64/Agentrix.app"
          codesign --verify --deep --strict "$app"
          codesign -dv "$app" 2>&1 | grep -q 'Signature=adhoc'
          test -x "$app/Contents/Resources/app.asar.unpacked/node_modules/node-pty/prebuilds/darwin-arm64/spawn-helper"
          titlebar="$app/Contents/Resources/app.asar.unpacked/native/mac-titlebar/build/Release/mac_titlebar.node"
          test -f "$titlebar"
          lipo "$titlebar" -verify_arch arm64
          test ! -e "$app/Contents/Resources/app.asar.unpacked/node_modules/sherpa-onnx-darwin-arm64"
          packed=$(npx --no-install @electron/asar list "$app/Contents/Resources/app.asar" --is-pack)
          if grep -E '/node_modules/sherpa-onnx-(win|darwin|linux)-' <<< "$packed"; then echo 'Speech engines are in the macOS app.'; exit 1; fi
          grep -Fx 'pack   : /node_modules/sherpa-onnx-node/sherpa-onnx.js' <<< "$packed"
          test -f "$app/Contents/Resources/integration/bash-integration.bash"
          test -f "$app/Contents/Resources/integration/zsh-integration.zsh"
          test -f "$app/Contents/Resources/integration/agent-event.cjs"
          test -x "$app/Contents/Resources/integration/ssh-askpass.sh"
          if ls "$app/Contents/Resources/integration" | grep -Ei '\.(ps1|cmd|exe|cs)$'; then echo 'Windows integration files are in the macOS app.'; exit 1; fi
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$app/Contents/Info.plist"
          hdiutil verify "release/${{ steps.version.outputs.image }}"

      - name: Verify the packaged app runs a Bash terminal and follows Codex
        # Separate isolated GUI run: the SDK import and both provider processes stay real up to the fake executables.
        run: node scripts/retry.mjs node scripts/mac-smoke.mjs --packaged

      - name: Verify packaged SDK and app-server through fake native executables
        run: node scripts/retry.mjs npm run test:native-session -- --packaged --runtime

      - name: Verify the packaged app runs a zsh terminal and follows Codex
        run: node scripts/retry.mjs node scripts/mac-smoke.mjs --packaged --shell zsh

      - name: Install the built archive with the one-line installer
        shell: bash
        run: |
          AGENTRIX_INSTALL_DIR="$RUNNER_TEMP/Applications" AGENTRIX_OPEN=0 bash scripts/install-macos.sh "release/${{ steps.version.outputs.archive }}"
          codesign --verify --deep --strict "$RUNNER_TEMP/Applications/Agentrix.app"

      - name: Create checksums and build notes
        shell: bash
        run: |
          set -euo pipefail
          cd release
          shasum -a 256 "${{ steps.version.outputs.archive }}" "${{ steps.version.outputs.image }}" > SHA256SUMS-mac.txt
          cat SHA256SUMS-mac.txt
          {
            echo '## macOS build is ready'
            echo "- DMG: **${{ steps.version.outputs.image }}**"
            echo "- Zip for the install command: **${{ steps.version.outputs.archive }}**"
            echo "- Commit: $GITHUB_SHA"
            echo '- Unit tests, a real zsh terminal test and the packaged desktop test passed.'
            echo '- Download **Agentrix-macos-arm64** from the Artifacts section of this run.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Agentrix-macos-arm64
          path: |
            release/Agentrix-*-mac-arm64.dmg
            release/Agentrix-*-mac-arm64.zip
            release/SHA256SUMS-mac.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      - name: Upload desktop test screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-desktop-test-screenshots
          path: .test-output/mac-*/*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  linux:
    needs: reuse
    if: needs.reuse.outputs['run-id'] == ''
    name: Linux ${{ matrix.arch }} build and desktop tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CI: 'true'
      AGENTRIX_TEST_TIMEOUT_SCALE: '2'

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Validate release version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo 'Invalid package version.'; exit 1; }
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "v$version" ]]; then echo 'The version tag must match package.json.'; exit 1; fi
          image_arch=${{ matrix.arch == 'x64' && 'x86_64' || 'arm64' }}
          echo "image=Agentrix-$version-linux-$image_arch.AppImage" >> "$GITHUB_OUTPUT"
          echo "archive=Agentrix-$version-linux-${{ matrix.arch }}.tar.xz" >> "$GITHUB_OUTPUT"
          echo "unpacked=release/${{ matrix.arch == 'x64' && 'linux-unpacked' || 'linux-arm64-unpacked' }}" >> "$GITHUB_OUTPUT"

      - name: Install zsh, a virtual display and FUSE for the AppImage
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh xvfb xauth fuse3

      - name: Install locked dependencies
        # A dropped connection (npm's ECONNRESET) once failed a release build before any test ran: one more try.
        shell: bash
        run: npm ci --no-audit --no-fund || { sleep 10; npm ci --no-audit --no-fund; }
      - name: Remove bundled Claude platform binaries
        run: node scripts/claude-sdk-pack.cjs --clean

      - name: Run unit and integration tests, including real Bash and zsh terminals
        run: npm test

      - name: Build the AppImage and tar.xz
        run: npm run dist:linux

      - name: Verify the package
        shell: bash
        run: |
          set -euo pipefail
          app="${{ steps.version.outputs.unpacked }}"
          test -x "$app/agentrix"
          test -f "release/${{ steps.version.outputs.image }}"
          test -f "release/${{ steps.version.outputs.archive }}"
          test -f "$app/resources/app.asar.unpacked/node_modules/node-pty/prebuilds/linux-${{ matrix.arch }}/pty.node"
          test ! -e "$app/resources/app.asar.unpacked/node_modules/sherpa-onnx-linux-${{ matrix.arch }}"
          packed=$(npx --no-install @electron/asar list "$app/resources/app.asar" --is-pack)
          if grep -E '/node_modules/sherpa-onnx-(win|darwin|linux)-' <<< "$packed"; then echo 'Speech engines are in the Linux app.'; exit 1; fi
          grep -Fx 'pack   : /node_modules/sherpa-onnx-node/sherpa-onnx.js' <<< "$packed"
          for name in bash-integration.bash zsh-integration.zsh agent-event.cjs; do test -f "$app/resources/integration/$name"; done
          test -x "$app/resources/integration/ssh-askpass.sh"
          if ls "$app/resources/integration" | grep -Ei '\.(ps1|cmd|exe|cs)$'; then echo 'Windows integration files are in the Linux app.'; exit 1; fi
          if ls "$app/resources/app.asar.unpacked/node_modules/node-pty/prebuilds" | grep -E '^(win32|darwin)-'; then echo 'Other platforms PTY binaries are in the Linux app.'; exit 1; fi
          top=$(npx --no-install asar list "$app/resources/app.asar" | cut -d/ -f2 | sort -u | tr '\n' ' ')
          echo "app.asar: $top"
          [[ $top == 'LICENSE assets dist electron node_modules package.json ' ]] || { echo 'Unexpected files in app.asar.'; exit 1; }

      - name: Verify the packaged app runs a Bash terminal and follows Codex
        run: xvfb-run -a node scripts/retry.mjs node scripts/linux-smoke.mjs --packaged

      - name: Verify packaged SDK and app-server through fake native executables
        run: xvfb-run -a node scripts/retry.mjs npm run test:native-session -- --packaged --runtime

      - name: Verify the packaged app runs a zsh terminal and follows Codex
        run: xvfb-run -a node scripts/retry.mjs node scripts/linux-smoke.mjs --packaged --shell zsh

      - name: Verify the AppImage starts and keeps its environment out of terminals
        run: xvfb-run -a node scripts/retry.mjs node scripts/appimage-smoke.mjs "release/${{ steps.version.outputs.image }}"

      - name: Create checksums and build notes
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum "${{ steps.version.outputs.image }}" "${{ steps.version.outputs.archive }}" > "SHA256SUMS-linux-${{ matrix.arch }}.txt"
          cat "SHA256SUMS-linux-${{ matrix.arch }}.txt"
          {
            echo "## Linux ${{ matrix.arch }} build is ready"
            echo "- AppImage: **${{ steps.version.outputs.image }}**"
            echo "- Archive: **${{ steps.version.outputs.archive }}**"
            echo "- Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Agentrix-linux-${{ matrix.arch }}
          path: |
            release/${{ steps.version.outputs.image }}
            release/${{ steps.version.outputs.archive }}
            release/SHA256SUMS-linux-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload desktop test screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ matrix.arch }}-desktop-test-screenshots
          path: .test-output/linux-*/*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub Release
    # always() is required because a verified reuse deliberately skips the build dependencies.
    if: >-
      always() && !cancelled() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_dry_run)) &&
      needs.reuse.result == 'success' && (needs.reuse.outputs['run-id'] != '' ||
      (needs.windows.result == 'success' && needs['windows-desktop'].result == 'success' && needs.macos.result == 'success' && needs.linux.result == 'success' && needs['remote-linux'].result == 'success'))
    needs: [reuse, windows, windows-desktop, macos, linux, remote-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.release_dry_run }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo 'Invalid package version.'; exit 1; }
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          else
            test "$RELEASE_DRY_RUN" = 'true'
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "installer=Agentrix-Setup-$version-x64.exe" >> "$GITHUB_OUTPUT"
          echo "archive=Agentrix-$version-mac-arm64.zip" >> "$GITHUB_OUTPUT"
          echo "image=Agentrix-$version-mac-arm64.dmg" >> "$GITHUB_OUTPUT"

      - name: Select artifacts from this tested run
        id: artifacts
        if: needs.reuse.outputs['run-id'] == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-select-build.mjs --current-run

      - name: Download the tested release builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.reuse.outputs['artifact-ids'] || steps.artifacts.outputs['artifact-ids'] }}
          merge-multiple: true
          path: release-assets
          run-id: ${{ needs.reuse.outputs['run-id'] || github.run_id }}
          github-token: ${{ github.token }}

      - name: Verify release assets and prepare notes
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_INSTALLER: ${{ steps.version.outputs.installer }}
          MAC_ARCHIVE: ${{ steps.version.outputs.archive }}
          MAC_IMAGE: ${{ steps.version.outputs.image }}
          BUILD_RUN_ID: ${{ needs.reuse.outputs['run-id'] || github.run_id }}
        run: |
          set -euo pipefail
          changes=$(node scripts/release-notes.mjs --version "$RELEASE_VERSION")
          cd release-assets
          test -f "$RELEASE_INSTALLER"
          test -f "$RELEASE_INSTALLER.blockmap"
          test -f latest.yml
          test -f "$MAC_ARCHIVE"
          test -f "$MAC_IMAGE"
          tr -d '\r' < BUILD-INFO.txt | grep -Fx "Commit: $GITHUB_SHA"
          sha256sum --check SHA256SUMS.txt
          sha256sum --check SHA256SUMS-mac.txt
          linux=("Agentrix-$RELEASE_VERSION-linux-x86_64.AppImage" "Agentrix-$RELEASE_VERSION-linux-x64.tar.xz" "Agentrix-$RELEASE_VERSION-linux-arm64.AppImage" "Agentrix-$RELEASE_VERSION-linux-arm64.tar.xz")
          for file in "${linux[@]}"; do test -f "$file"; done
          sha256sum --check SHA256SUMS-linux-x64.txt SHA256SUMS-linux-arm64.txt
          assets=("$RELEASE_INSTALLER" "$RELEASE_INSTALLER.blockmap" latest.yml SHA256SUMS.txt BUILD-INFO.txt "$MAC_IMAGE" "$MAC_ARCHIVE" SHA256SUMS-mac.txt "${linux[@]}" SHA256SUMS-linux-x64.txt SHA256SUMS-linux-arm64.txt)

          release_notice=''
          macos_install='bash'
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            release_notice="**Test build:** This prerelease may be unstable. Windows updates use the Stable channel by default; choose Beta in Settings > About and accept the test agreement to receive test updates."$'\n\n'
            macos_install="AGENTRIX_VERSION=$RELEASE_VERSION bash"
          fi
          cat > release-notes.md <<EOF
          ${release_notice}The Windows x64 installer of Agentrix, a macOS edition for Apple silicon, and Linux editions for x64 and arm64.

          **Windows — recommended:** install **$RELEASE_INSTALLER** to enable automatic update checks and background downloads.

          **macOS (Apple silicon, macOS 12 or later):** install or update with one command; the app opens directly, without the "cannot verify the developer" prompt:

          \`\`\`
          curl -fsSL https://raw.githubusercontent.com/noeigenstate/Agentrix/main/scripts/install-macos.sh | $macos_install
          \`\`\`

          Or download **$MAC_IMAGE** and drag Agentrix to Applications. The app is signed ad hoc, not notarized by Apple: on first open, allow it once in System Settings › Privacy & Security (Open Anyway), or run \`xattr -dr com.apple.quarantine "/Applications/Agentrix.app"\`. The macOS edition does not update itself; run the command again to update.

          **Linux (x64 and arm64):** download the AppImage for your processor (**Agentrix-$RELEASE_VERSION-linux-x86_64.AppImage** or **Agentrix-$RELEASE_VERSION-linux-arm64.AppImage**), make it executable with \`chmod +x\` and run it. The **.tar.xz** archives hold the same app: unpack and run \`./agentrix\` (on Ubuntu 23.10 or later, add \`--no-sandbox\`; the AppImage does that by itself when needed). Local terminals run Bash or zsh, chosen in Settings. The Linux edition does not update itself; download the new version to update.

          Install Codex CLI on the computer or Linux SSH host where your project runs.

          $changes

          Commit: $GITHUB_SHA
          Build: https://github.com/$GH_REPO/actions/runs/$BUILD_RUN_ID
          SHA-256 checksums are attached in **SHA256SUMS.txt**.
          EOF

          printf '%s\n' "${assets[@]}" > release-assets.txt
          if [[ "$RELEASE_DRY_RUN" == 'true' ]]; then
            echo "Dry run: would publish $RELEASE_TAG from tested build $BUILD_RUN_ID with these assets:"
            cat release-assets.txt
            cat release-notes.md
          fi

      - name: Publish verified release assets
        if: startsWith(github.ref, 'refs/tags/v') && !(github.event_name == 'workflow_dispatch' && inputs.release_dry_run)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_INSTALLER: ${{ steps.version.outputs.installer }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "$RELEASE_TAG"
          cd release-assets
          mapfile -t assets < release-assets.txt
          flags=(--latest)
          if [[ "$RELEASE_VERSION" == *-* ]]; then flags=(--prerelease --latest=false); fi

          if gh release view "$RELEASE_TAG" --json isDraft,targetCommitish,assets > existing-release.json 2>/dev/null; then
            # A rerun may finish its own draft, but must never replace a published installer.
            jq -e --arg commit "$GITHUB_SHA" '.targetCommitish == $commit' existing-release.json
            if [[ "$(jq -r '.isDraft' existing-release.json)" == 'false' ]]; then
              jq -e --arg installer "$RELEASE_INSTALLER" 'any(.assets[]; .name == $installer) and any(.assets[]; .name == ($installer + ".blockmap")) and any(.assets[]; .name == "latest.yml")' existing-release.json
              echo "Release $RELEASE_TAG is already published."
              exit 0
            fi
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" --draft=false --title "Agentrix $RELEASE_TAG" --notes-file release-notes.md "${flags[@]}"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag --target "$GITHUB_SHA" --title "Agentrix $RELEASE_TAG" \
              --notes-file release-notes.md "${flags[@]}"
          fi

          echo "Release: https://github.com/$GH_REPO/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
